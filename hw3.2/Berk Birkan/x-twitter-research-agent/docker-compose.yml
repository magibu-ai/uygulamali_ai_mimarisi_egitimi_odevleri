services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: x_research
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - x_research_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d x_research"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  x_research_pgdata:

