[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "x-twitter-research-agent"
version = "0.1.0"
description = "Tool-calling X/Twitter research agent using OpenRouter, Xquik and PostgreSQL"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
  "alembic>=1.14,<2",
  "eval-type-backport>=0.2,<1; python_version < '3.10'",
  "fastapi==0.112.4",
  "gradio>=4.44,<5",
  "huggingface-hub>=0.25,<1",
  "httpx>=0.27,<1",
  "pydantic==2.10.6",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "spaces>=0.31,<1",
  "starlette==0.38.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP045"]
