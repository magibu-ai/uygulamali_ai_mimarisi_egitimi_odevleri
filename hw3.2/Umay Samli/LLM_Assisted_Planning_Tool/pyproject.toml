[project]
name = "llm-assisted-planning-tool"
version = "0.1.0"
description = "Ollama tool-calling ile haftalik gorev planlama asistani"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gradio>=5.49,<7",
    "ollama>=0.6,<1",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "reportlab>=4.4,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
