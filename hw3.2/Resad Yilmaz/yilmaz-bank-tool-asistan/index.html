<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yılmaz Bank — Sanal Şube Asistanı</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>

<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app-shell">

  <header class="topbar">
    <svg class="mark-sm" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="markGradientSm" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ffd27a"/>
          <stop offset="35%" stop-color="#ff9d7a"/>
          <stop offset="70%" stop-color="#b18cf5"/>
          <stop offset="100%" stop-color="#5ec8f2"/>
        </linearGradient>
      </defs>
      <circle cx="16" cy="16" r="14" stroke="url(#markGradientSm)" stroke-width="1.6"/>
      <circle cx="16" cy="16" r="8.5" stroke="url(#markGradientSm)" stroke-width="1.2"/>
      <circle cx="16" cy="16" r="2" fill="url(#markGradientSm)"/>
    </svg>
    <span class="brand">Yılmaz Bank</span>
  </header>

  <main id="thread" class="thread">

    <div id="empty-state" class="empty-state">
      <svg class="mark-lg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="markGradientLg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ffd27a"/>
            <stop offset="35%" stop-color="#ff9d7a"/>
            <stop offset="70%" stop-color="#b18cf5"/>
            <stop offset="100%" stop-color="#5ec8f2"/>
          </linearGradient>
        </defs>
        <circle cx="32" cy="32" r="28" stroke="url(#markGradientLg)" stroke-width="2"/>
        <circle cx="32" cy="32" r="17" stroke="url(#markGradientLg)" stroke-width="1.5"/>
        <circle cx="32" cy="32" r="4" fill="url(#markGradientLg)"/>
        <line x1="32" y1="14" x2="32" y2="21" stroke="url(#markGradientLg)" stroke-width="1.5"/>
        <line x1="32" y1="43" x2="32" y2="50" stroke="url(#markGradientLg)" stroke-width="1.5"/>
        <line x1="14" y1="32" x2="21" y2="32" stroke="url(#markGradientLg)" stroke-width="1.5"/>
        <line x1="43" y1="32" x2="50" y2="32" stroke="url(#markGradientLg)" stroke-width="1.5"/>
      </svg>

      <h1>Yılmaz Bank Sanal Şube</h1>
      <p>Hesabınızla ilgili bir isteğinizi yazın — bakiye, transfer, kart işlemleri.</p>

      <div class="suggestion-grid" id="suggestion-grid">
        <button class="suggestion" data-category="query" data-query="1 numaralı hesabın bakiyesi ne kadar?">
          <span class="s-title">Bakiye sorgula</span>
          <span class="s-sub">Hesabın güncel bakiyesini gör</span>
        </button>
        <button class="suggestion" data-category="transfer" data-query="3 numaralı hesaptan 4 numaralı hesaba 250 TL transfer yap.">
          <span class="s-title">Para transfer et</span>
          <span class="s-sub">İki hesap arasında transfer yap</span>
        </button>
        <button class="suggestion" data-category="query" data-query="1 numaralı kullanıcının tüm hesaplarını listele.">
          <span class="s-title">Hesapları listele</span>
          <span class="s-sub">Bir kullanıcının tüm hesapları</span>
        </button>
        <button class="suggestion" data-category="card" data-query="5 numaralı hesaba yeni bir sanal kart oluştur.">
          <span class="s-title">Yeni kart oluştur</span>
          <span class="s-sub">Hesaba sanal/fiziksel kart ekle</span>
        </button>
      </div>
    </div>

    <div id="messages" class="messages"></div>

  </main>

  <form id="composer" class="composer">
    <textarea
      id="query-input"
      rows="1"
      placeholder="Yılmaz Bank'a bir şey sorun…"
    ></textarea>
    <button id="submit-button" type="submit" class="send-btn" aria-label="Gönder">
      <svg viewBox="0 0 24 24" fill="none" width="18" height="18" aria-hidden="true">
        <path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </form>

</div>

<script src="app.js"></script>
</body>
</html>
