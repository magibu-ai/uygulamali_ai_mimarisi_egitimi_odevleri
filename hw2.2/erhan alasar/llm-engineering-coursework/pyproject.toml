[project]
name = "turkish-mmlu-benchmark"
version = "0.1.0"
description = "Turkish MMLU evaluation runner for local Ollama models"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.9",
    "datasets>=4.0",
    "huggingface-hub>=0.34",
    "pandas>=2.2",
    "peft>=0.17",
    "pyarrow>=18",
    "sentence-transformers>=5.0",
    "torch>=2.7",
    "transformers>=4.53",
]
