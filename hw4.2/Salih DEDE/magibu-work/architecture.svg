<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1330 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="1330" height="560" fill="#ffffff"/>

  <!-- 1. Soru -->
  <rect x="20" y="245" width="140" height="70" rx="10" fill="#eef1f5" stroke="#8a94a3"/>
  <text x="90" y="275" text-anchor="middle" font-size="14" fill="#1f2937">Kullanıcı</text>
  <text x="90" y="293" text-anchor="middle" font-size="14" fill="#1f2937">Sorusu</text>

  <!-- 2. Rewrite -->
  <rect x="200" y="245" width="160" height="70" rx="10" fill="#e0ecff" stroke="#5b8def"/>
  <text x="280" y="270" text-anchor="middle" font-size="13" fill="#1f2937">Sorguyu Düzelt</text>
  <text x="280" y="288" text-anchor="middle" font-size="12" fill="#4b5563">(LLM)</text>
  <text x="280" y="305" text-anchor="middle" font-size="11" fill="#6b7280">yazım · ansiklopedik dil</text>

  <!-- Hybrid retrieval container -->
  <rect x="405" y="120" width="230" height="290" rx="12" fill="none" stroke="#a3a3a3" stroke-dasharray="5,4"/>
  <text x="520" y="140" text-anchor="middle" font-size="12" fill="#6b7280">Hybrid Retrieval</text>

  <!-- 3a. Dense -->
  <rect x="425" y="150" width="190" height="70" rx="10" fill="#fef3c7" stroke="#d9a441"/>
  <text x="520" y="175" text-anchor="middle" font-size="13" fill="#1f2937">Dense Arama</text>
  <text x="520" y="192" text-anchor="middle" font-size="11" fill="#6b7280">pgvector HNSW · cosine</text>
  <text x="520" y="207" text-anchor="middle" font-size="10" fill="#9ca3af">e5-large embedding</text>

  <!-- 3b. Sparse -->
  <rect x="425" y="310" width="190" height="70" rx="10" fill="#fce7f3" stroke="#d879b0"/>
  <text x="520" y="335" text-anchor="middle" font-size="13" fill="#1f2937">Sparse Arama</text>
  <text x="520" y="352" text-anchor="middle" font-size="11" fill="#6b7280">BM25 · ParadeDB</text>
  <text x="520" y="367" text-anchor="middle" font-size="10" fill="#9ca3af">tam metin eşleşmesi</text>

  <!-- 4. RRF -->
  <rect x="675" y="245" width="150" height="70" rx="10" fill="#e0ecff" stroke="#5b8def"/>
  <text x="750" y="270" text-anchor="middle" font-size="13" fill="#1f2937">RRF Füzyonu</text>
  <text x="750" y="288" text-anchor="middle" font-size="10" fill="#6b7280">Σ 1/(60+sıra)</text>
  <text x="750" y="303" text-anchor="middle" font-size="10" fill="#9ca3af">iki listeyi birleştirir</text>

  <!-- 5. Parent expand -->
  <rect x="865" y="245" width="170" height="70" rx="10" fill="#eef1f5" stroke="#8a94a3"/>
  <text x="950" y="270" text-anchor="middle" font-size="13" fill="#1f2937">Parent'a Genişlet</text>
  <text x="950" y="288" text-anchor="middle" font-size="10" fill="#6b7280">child → tam makale</text>
  <text x="950" y="303" text-anchor="middle" font-size="10" fill="#9ca3af">en iyi 4 kaynak</text>

  <!-- 6. Judge -->
  <rect x="1075" y="245" width="160" height="70" rx="10" fill="#e0ecff" stroke="#5b8def"/>
  <text x="1155" y="270" text-anchor="middle" font-size="13" fill="#1f2937">LLM Yargısı</text>
  <text x="1155" y="288" text-anchor="middle" font-size="10" fill="#6b7280">bağlam yeterli mi?</text>
  <text x="1155" y="303" text-anchor="middle" font-size="10" fill="#9ca3af">uydurmadan karar verir</text>

  <!-- 7. Answer -->
  <rect x="1075" y="60" width="160" height="60" rx="10" fill="#dcfce7" stroke="#4caf6f"/>
  <text x="1155" y="85" text-anchor="middle" font-size="13" fill="#1f2937">Cevap ✅</text>
  <text x="1155" y="102" text-anchor="middle" font-size="10" fill="#6b7280">kaynak makaleyle</text>

  <!-- 8. Refusal -->
  <rect x="1075" y="440" width="180" height="60" rx="10" fill="#fee2e2" stroke="#d9736b"/>
  <text x="1165" y="465" text-anchor="middle" font-size="13" fill="#1f2937">"Bilmiyorum" ❌</text>
  <text x="1165" y="482" text-anchor="middle" font-size="10" fill="#6b7280">halüsinasyon yok</text>

  <!-- arrows: main flow -->
  <path d="M160,280 H198" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M360,270 Q392,220 423,190" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M360,290 Q392,340 423,345" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M615,195 Q650,220 673,255" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M615,340 Q650,300 673,275" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M825,280 H863" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M1035,280 H1073" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M1155,245 V122" stroke="#4caf6f" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="1163" y="185" font-size="10" fill="#4caf6f">yeterli</text>

  <!-- retry loop -->
  <path d="M1075,270 C 950,470 700,470 300,340 C 260,320 250,310 260,295"
        stroke="#d9a441" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="650" y="452" text-anchor="middle" font-size="11" fill="#a16207">yetersiz → sorgu yeniden yazılır (en fazla 3 deneme)</text>

  <!-- final refusal -->
  <path d="M1155,315 V438" stroke="#d9736b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="1163" y="390" font-size="10" fill="#d9736b">3 deneme tükendi</text>

  <!-- step numbers -->
  <text x="90" y="240" text-anchor="middle" font-size="11" fill="#9ca3af">1</text>
  <text x="280" y="240" text-anchor="middle" font-size="11" fill="#9ca3af">2</text>
  <text x="520" y="128" text-anchor="middle" font-size="11" fill="#9ca3af">3</text>
  <text x="750" y="240" text-anchor="middle" font-size="11" fill="#9ca3af">4</text>
  <text x="950" y="240" text-anchor="middle" font-size="11" fill="#9ca3af">5</text>
  <text x="1155" y="240" text-anchor="middle" font-size="11" fill="#9ca3af">6</text>
</svg>
