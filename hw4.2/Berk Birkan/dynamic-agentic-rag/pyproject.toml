[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-agentic-rag"
version = "0.1.0"
description = "User-built knowledge bases with traditional and LangGraph agentic RAG"
requires-python = ">=3.10"
dependencies = [
  "chromadb>=1.0,<2",
  "datasets>=3,<5",
  "gradio>=5,<6",
  "httpx>=0.27,<1",
  "langgraph>=0.6,<2",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.1,<4",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "sentence-transformers>=5.2,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
