[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turkish-medical-vector-search"
version = "0.1.0"
description = "Reproducible Turkish medical vector search and threshold evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "chromadb>=1.0,<2",
  "datasets>=3.0,<5",
  "huggingface-hub>=0.30,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "pyarrow>=15,<23",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.4,<2",
  "sentence-transformers>=5.2,<6",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
  "pytest-cov>=5.0,<8",
  "ruff>=0.9,<1",
]
notebook = [
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.2,<5",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
]
llm = [
  "accelerate>=1.2,<2",
  "bitsandbytes>=0.45,<1; platform_system != 'Darwin'",
  "transformers>=4.52.4,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
