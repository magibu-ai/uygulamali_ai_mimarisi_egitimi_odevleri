name: ezan_vakti
description: "Ezan Vakti Uygulaması"
publish_to: "none"
version: 3.4.1+8

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.4.0
  shared_preferences: ^2.2.3
  http: ^1.2.0
  intl: ^0.19.0
  timezone: ^0.9.4
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.10.0
  share_plus: ^10.0.0
  adhan_dart: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FDF8F5"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
